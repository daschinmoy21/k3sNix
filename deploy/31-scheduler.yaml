# A second kube-scheduler with one profile, k3snix, that calls the extender.
# Pods opt in with `schedulerName: k3snix`; every other pod keeps the
# default scheduler. The image tag must match the cluster's Kubernetes
# minor version (K3s v1.32 here); hack/e2e-k3d.sh rewrites it to the
# server's version.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k3snix-scheduler
  namespace: k3snix
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k3snix-scheduler-as-kube-scheduler
subjects:
  - kind: ServiceAccount
    name: k3snix-scheduler
    namespace: k3snix
roleRef:
  kind: ClusterRole
  name: system:kube-scheduler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k3snix-scheduler-as-volume-scheduler
subjects:
  - kind: ServiceAccount
    name: k3snix-scheduler
    namespace: k3snix
roleRef:
  kind: ClusterRole
  name: system:volume-scheduler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k3snix-scheduler-extension-apiserver-authentication-reader
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: k3snix-scheduler
    namespace: k3snix
roleRef:
  kind: Role
  name: extension-apiserver-authentication-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k3snix-scheduler-config
  namespace: k3snix
data:
  config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    # One replica; leader election would need a lease the
    # system:kube-scheduler role does not grant under this name.
    leaderElection:
      leaderElect: false
    profiles:
      - schedulerName: k3snix
    extenders:
      - urlPrefix: http://k3snix-extender.k3snix.svc.cluster.local:9870
        filterVerb: filter
        prioritizeVerb: prioritize
        # Extender scores 0..10 are scaled to 0..100 and multiplied by the
        # weight. At 3 a fully cached node gains up to 300 points: enough to
        # outweigh ImageLocality and the balance scores, while Filter still
        # drops nodes without room, so resource fit stays in the loop.
        weight: 3
        httpTimeout: 2s
        enableHTTPS: false
        nodeCacheCapable: false
        # An unreachable or failing extender is skipped and the pod is
        # scheduled by the default plugins alone.
        ignorable: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k3snix-scheduler
  namespace: k3snix
  labels:
    app: k3snix-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k3snix-scheduler
  template:
    metadata:
      labels:
        app: k3snix-scheduler
    spec:
      serviceAccountName: k3snix-scheduler
      containers:
        - name: kube-scheduler
          image: registry.k8s.io/kube-scheduler:v1.32.5
          imagePullPolicy: IfNotPresent
          command:
            - kube-scheduler
            - --config=/etc/k3snix/config.yaml
            - --v=2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 10259
              scheme: HTTPS
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 10259
              scheme: HTTPS
          volumeMounts:
            - name: config
              mountPath: /etc/k3snix
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: k3snix-scheduler-config
