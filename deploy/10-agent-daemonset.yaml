apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: k3snix-agent
  namespace: k3snix
  labels:
    app: k3snix-agent
spec:
  selector:
    matchLabels:
      app: k3snix-agent
  template:
    metadata:
      labels:
        app: k3snix-agent
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: k3snix:dev
          imagePullPolicy: Never
          command: ["/bin/k3snix-agent"]
          args:
            - -listen=:9860
            - -store=/data/store
            - -catalog=/catalog
            - -seed-by-node
            - -seed-label=e2e
            - -origin=http://k3snix-origin.k3snix.svc.cluster.local:9877
            # /v1/fetch unpacks verified NARs into the store volume, trying
            # the other agents (k3snix-agent-peers) before the origin.
            - -materialize=dir
            - -peers-dns=k3snix-agent-peers.k3snix.svc.cluster.local
            - -peer-port=9860
            # One GC root per pod that fetched through this agent, removed
            # once the kubelet has removed the pod.
            - -gcroots-dir=/data/gcroots
            - -kubelet-pods-dir=/host/kubelet-pods
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 9860
              hostPort: 9860
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9860
          volumeMounts:
            - name: store
              mountPath: /data/store
            - name: gcroots
              mountPath: /data/gcroots
            - name: kubelet-pods
              mountPath: /host/kubelet-pods
              readOnly: true
            - name: catalog
              mountPath: /catalog
              readOnly: true
      volumes:
        # The node's store for host-store pods, which mount it read-only
        # at /nix/store (deploy/examples/hello-hoststore.yaml). On nodes
        # with Nix this is /nix/store itself, with -materialize=nix and
        # -gcroots-dir under /nix/var/nix/gcroots.
        - name: store
          hostPath:
            path: /var/lib/k3snix/store
            type: DirectoryOrCreate
        - name: gcroots
          hostPath:
            path: /var/lib/k3snix/gcroots
            type: DirectoryOrCreate
        - name: kubelet-pods
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: catalog
          configMap:
            name: k3snix-catalog
---
# Headless: resolves to every agent's node IP, so agents find their peers
# without a Kubernetes client.
apiVersion: v1
kind: Service
metadata:
  name: k3snix-agent-peers
  namespace: k3snix
  labels:
    app: k3snix-agent
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: k3snix-agent
  ports:
    - port: 9860
      targetPort: 9860
