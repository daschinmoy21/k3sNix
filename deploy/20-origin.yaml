apiVersion: apps/v1
kind: Deployment
metadata:
  name: k3snix-origin
  namespace: k3snix
  labels:
    app: k3snix-origin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k3snix-origin
  template:
    metadata:
      labels:
        app: k3snix-origin
    spec:
      containers:
        - name: origin
          image: k3snix:dev
          imagePullPolicy: Never
          command: ["/bin/k3snix-agent"]
          # The pod sees the whole host store; -catalog-only limits what it
          # serves to the pinned closures in the catalog, which is what the
          # origin is preloaded with. Every narinfo is signed with the key in
          # the k3snix-origin-key Secret.
          args:
            - -listen=:9877
            - -store=/nix/store
            - -catalog=/catalog
            - -catalog-only
            - -sign-key-file=/keys/secret-key
          ports:
            - containerPort: 9877
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9877
          volumeMounts:
            - name: nixstore
              mountPath: /nix/store
              readOnly: true
            - name: catalog
              mountPath: /catalog
              readOnly: true
            - name: key
              mountPath: /keys
              readOnly: true
      volumes:
        - name: nixstore
          hostPath:
            path: /nix/store
            type: Directory
        - name: catalog
          configMap:
            name: k3snix-origin-catalog
        - name: key
          secret:
            secretName: k3snix-origin-key
---
apiVersion: v1
kind: Service
metadata:
  name: k3snix-origin
  namespace: k3snix
  labels:
    app: k3snix-origin
spec:
  selector:
    app: k3snix-origin
  ports:
    - port: 9877
      targetPort: 9877
